# CI — 보안 레벨 L1 (docs/planning.md#17-8): lockfile 고정 설치 · 린트 · 타입 · 빌드 · 비밀 스캔 · 의존성 점검
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 설치 (lockfile 고정)
        run: pnpm install --frozen-lockfile
      - name: 린트
        run: pnpm lint
      - name: 타입 검사
        run: pnpm typecheck
      - name: 빌드
        run: pnpm --filter web build
      - name: 의존성 취약점 점검 (high 이상)
        run: pnpm audit --prod --audit-level high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 비밀 스캔
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
